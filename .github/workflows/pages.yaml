# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/refs/heads/master/src/schemas/json/github-workflow.json
name: pages
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      # The site renders helm-schema's live output as committed schema snippets.
      # A change to the tool itself (crates/, Cargo.*) runs the bench workflow,
      # which deploys the site after recording the benchmark.
      - "scripts/schemas.sh"
      - "mise.toml"
      - "mise.lock"
      - "taskfile.yaml"
      - ".github/workflows/pages.yaml"
  workflow_dispatch: {}
  # The bench workflow deploys the site after each benchmark it records, so the
  # dashboard at /bench/ shows the new history.
  workflow_call: {}

env:
  MISE_GITHUB_TOKEN: ${{ github.token }}
  MISE_AUTO_INSTALL: "0"

# Allow the GITHUB_TOKEN to deploy to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; don't cancel an in-progress production deploy.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      # The site as main holds it now, whichever run asked for the deploy.
      - uses: actions/checkout@v7
        with:
          ref: main
      # Go, Python, and the extended Hugo build come from mise.
      - uses: jdx/mise-action@v4
        with:
          install: false
          cache: true
          env: false
      - run: mise install task go python "asdf:NeoHsu/asdf-hugo"
      # helm-schema is built from source so the docs render its live output
      # (schema snippets generated from docs/examples by scripts/schemas.sh).
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: mozilla-actions/sccache-action@v0.0.10
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
      # Regenerates the schema snippets from the current source, then builds the
      # site — the same `task docs:build` used locally. mise-action puts the tool
      # shims on PATH, so `task` resolves as in the other workflows.
      - name: Build docs
        run: task docs:build -- --baseURL "${{ steps.pages.outputs.base_url }}/"
      # The benchmark dashboard beside the documentation, at /bench/, with the
      # history the bench workflow records on `gh-pages` (read through the API,
      # no checkout). Installed after the Hugo build, which may clean
      # docs/public. Before the first benchmark run there is no history yet,
      # and the documentation still deploys.
      - name: Install the benchmark dashboard
        uses: romnn/benchtrail@v0.3.0
        with:
          path: docs/public/bench
          benchmark-data-dir-path: bench
          allow-missing-history: true
          settings: |
            {
              "title": "helm-schema benchmarks",
              "links": [{ "label": "Documentation", "url": "../" }],
              "threshold": 0.1,
              "label": "{{chart}} / {{profile}}",
              "dimensions": {
                "chart": { "label": "Chart", "order": 0 },
                "profile": { "label": "Profile", "order": 1 }
              },
              "colorBy": "chart",
              "dashBy": "profile"
            }
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/public

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

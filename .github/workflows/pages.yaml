# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/refs/heads/master/src/schemas/json/github-workflow.json
name: pages
on:
  # Every push to main runs the bench workflow, which deploys the site after it
  # records the benchmark, so the dashboard at /bench/ shows the new history and
  # the docs (whose schema snippets render helm-schema's live output) follow
  # every commit. A push trigger here would deploy each commit twice.
  workflow_call: {}
  workflow_dispatch: {}

env:
  MISE_GITHUB_TOKEN: ${{ github.token }}
  MISE_AUTO_INSTALL: "0"

# Allow the GITHUB_TOKEN to deploy to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; don't cancel an in-progress production deploy.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      # The site as main holds it now, whichever run asked for the deploy.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      # Go, Python, and the extended Hugo build come from mise.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false
          cache: true
          env: false
      - run: mise install task go python "asdf:NeoHsu/asdf-hugo"
      # helm-schema is built from source so the docs render its live output
      # (schema snippets generated from docs/examples by scripts/schemas.sh).
      # Every action is pinned to a commit (its release noted), since this workflow runs
      # after the bench job. The docs build with the current stable compiler: it only
      # renders schema snippets and records no measurement.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # Regenerates the schema snippets from the current source, then builds the
      # site — the same `task docs:build` used locally. mise-action puts the tool
      # shims on PATH, so `task` resolves as in the other workflows.
      - name: Build docs
        run: task docs:build -- --baseURL "${{ steps.pages.outputs.base_url }}/"
      # The benchmark dashboard beside the documentation, at /bench/, with the
      # history the bench workflow records on `gh-pages` (read through the API,
      # no checkout). Installed after the Hugo build, which may clean
      # docs/public. Before the first benchmark run there is no history yet,
      # and the documentation still deploys. Every value records the runner's
      # CPU model in its environment, which may change from run to run; it
      # must not start a new segment of the history, so it is ignored, as it
      # was before it was recorded. (Splitting the times into one series per
      # CPU model takes benchtrail's `splitEnvironment`, after the release
      # that adds it: tools/bench/README.md.)
      - name: Install the benchmark dashboard
        uses: romnn/benchtrail@b9608b8f4191a056be08a730d0312eb75bb9e366 # v0.3.0
        with:
          path: docs/public/bench
          benchmark-data-dir-path: bench
          allow-missing-history: true
          settings: |
            {
              "title": "helm-schema benchmarks",
              "links": [{ "label": "Documentation", "url": "../" }],
              "threshold": 0.1,
              "label": "{{chart}} / {{profile}}",
              "dimensions": {
                "chart": { "label": "Chart", "order": 0 },
                "profile": { "label": "Profile", "order": 1 }
              },
              "colorBy": "chart",
              "dashBy": "profile",
              "ignoreEnvironment": ["cpu"]
            }
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/public

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

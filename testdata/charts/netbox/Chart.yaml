annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: New release
      links:
        - name: Changelog on GitHub Releases
          url: https://github.com/netbox-community/netbox-chart/releases?q=netbox-
  artifacthub.io/images: |
    - name: netbox
      image: ghcr.io/netbox-community/netbox:v4.7.0
    - name: busybox
      image: docker.io/busybox:1.38.0
    - name: kubectl
      image: docker.io/rancher/kubectl:v1.36.2
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: Upstream Project
      url: https://github.com/netbox-community/netbox

ingress:
  annotations: {}
  # IngressClass used for ingresses created by the okteto installation. By default it's the default ingress class in the cluster
  oktetoIngressClass: okteto-controlplane-nginx
  # Okteto will set this as the value of the IngressClass for all the ingress resources managed by okteto. Leave  empty to fallback on your cluster's default ingress class.
  class:
  # If enabled, all ingresses deployed in namespaces managed by Okteto will have the ingress class defined in `ingress.class`.
  forceIngressClass: false
  # If enabled, all ingresses deployed in namespaces managed by Okteto must match the okteto wildcard subdomain
  forceIngressSubdomain: false
  # If using an ingress not managed by okteto, this option lets you configure the traffic to the Okteto API/Registry using the internal network
  ip: ""
# Endpoints configuration for the Okteto control plane and dev namespaces
endpoints:
  # Okteto control plane exposure configuration.
  # Exactly one of ingress or gatewayAPI must be enabled.
  okteto:
    ingress:
      # Enable Ingress-based exposure for the Okteto control plane (default behavior).
      # Requires ingress-nginx.enabled: true
      enabled: true
      # Custom annotations added to all Ingress resources for the control plane
      annotations: {}
      # Custom labels added to all Ingress resources for the control plane
      labels: {}
      # IngressClass used for Okteto control plane ingress resources.
      # If empty, falls back to ingress.oktetoIngressClass (default: okteto-controlplane-nginx)
      class: ""
      # IP of the ingress controller for internal DNS resolution.
      # If empty, falls back to ingress.ip
      controller:
        ip: ""
    gatewayAPI:
      # Enable Gateway API HTTPRoute-based exposure for the Okteto control plane.
      # Requires ingress-nginx.enabled: false.
      # The chart creates HTTPRoute objects; operators must provide an existing Gateway.
      enabled: false
      # Custom annotations added to all HTTPRoute resources for the control plane
      annotations: {}
      # Custom labels added to all HTTPRoute resources for the control plane
      labels: {}
      # Reference to the operator-managed Gateway to attach HTTPRoutes to.
      gateway:
        # Name of the Gateway (REQUIRED when gatewayAPI.enabled is true)
        name: ""
        # Namespace where the Gateway is located (REQUIRED when gatewayAPI.enabled is true)
        namespace: ""
        # Optional: section name within the Gateway (e.g., "https")
        section: ""
      # IP of the gateway controller for internal DNS resolution.
      # REQUIRED when gatewayAPI.enabled is true (no nginx fallback in Gateway API mode).
      controller:
        ip: ""
  dev:
    # Ingress configuration for dev namespaces
    ingress:
      # Informational flag indicating whether ingress-based endpoints are enabled for dev applications
      enabled: true
      # Custom annotations added to all ingresses in dev namespaces.
      # Takes precedence over namespace.ingress.annotations (legacy); merged with legacy values when both are set.
      annotations: {}
      # Custom labels added to all ingresses in dev namespaces.
      # Takes precedence over namespace.ingress.labels (legacy); merged with legacy values when both are set.
      labels: {}
      # Ingress class for dev namespace ingresses. Leave empty to use the cluster's default ingress class.
      # Takes precedence over ingress.class (legacy). If both are empty, falls back to built-in defaults.
      class: ""
      # If enabled, all ingresses in dev namespaces will have their ingress class overwritten.
      # Also enabled when ingress.forceIngressClass (legacy) is true.
      forceClass: false
      # If enabled, all ingresses in dev namespaces must match the okteto wildcard subdomain.
      # Also enabled when ingress.forceIngressSubdomain (legacy) is true.
      forceSubdomain: false
      # Subdomain for generating hosts. If empty, inherits from top-level subdomain value.
      subdomain: ""
    # Gateway API configuration for HTTPRoutes in dev namespaces
    gatewayAPI:
      # Enable Gateway API HTTPRoute mutation webhook
      enabled: false
      # Custom annotations added to all HTTPRoutes in dev namespaces
      annotations: {}
      # Custom labels added to all HTTPRoutes in dev namespaces
      labels: {}
      # Gateway reference configuration
      gateway:
        # Name of the Gateway to use for HTTPRoutes (REQUIRED when gatewayAPI.enabled is true)
        name: ""
        # Namespace where the Gateway is located (REQUIRED when gatewayAPI.enabled is true)
        namespace: ""
        # Section name within the Gateway (e.g., https, http)
        section: ""
        # Force mode: if true, applies transformations to ALL HTTPRoutes with gateway parentRefs
        # and overrides their gateway reference to use the configured gateway.
        # If false, only applies transformations to HTTPRoutes whose parentRef already matches
        # the configured gateway name/namespace.
        force: false
      # Controls rendering of the wildcard HTTPRoute that forwards unmatched traffic to the
      # default backend. Disable when an Ingress controller (or another Gateway listener) sits
      # in front and already handles wildcard routing itself, to avoid duplicate catch-all routes.
      defaultBackendHTTPRoute:
        enabled: true
      # BackendTrafficPolicy attached to an external wildcard HTTPRoute (e.g. the
      # installer-created "wildcard-to-ingress") that forwards *.<subdomain> dev traffic
      # from the app Gateway to okteto-nginx. It disables Envoy's default request timeout
      # (for long-lived user-app connections) and lets websocket + spdy/3.1 Upgrade streams
      # pass through the Envoy edge, matching ingress-nginx's transparent passthrough.
      # Enable when that wildcard route is in use (Gateway edge in front of okteto-nginx).
      # Requires the Envoy Gateway BackendTrafficPolicy CRD.
      wildcardHTTPRoute:
        # Name of the external wildcard HTTPRoute to attach the policy to.
        name: wildcard-to-ingress
        backendTrafficPolicy:
          enabled: false
      # Subdomain for generating hosts. If empty, inherits from top-level subdomain value.
      # Used for the "generate-host" annotation to create hostnames like: <name>-<namespace>.<subdomain>
      subdomain: ""
# Dependencies
ingress-nginx:
  enabled: true
  controller:
    # TODO @jpf-okteto: enableAnnotationValidations
    # https://github.com/kubernetes/ingress-nginx/blob/controller-v1.11.2/pkg/flags/flags.go#L161
    # This property was `false` in v1.11.2 (4.11.2)
    # https://github.com/kubernetes/ingress-nginx/blob/controller-v1.12.0/pkg/flags/flags.go#L162
    # It switched to `true` in v1.12.0 (4.12.0)
    enableAnnotationValidations: false
    image:
      chroot: true
      registry: ghcr.io
      image: okteto/ingress-nginx
      tag: 1.48.0
      digestChroot: ""
    allowSnippetAnnotations: true
    admissionWebhooks:
      enabled: false
      namespaceSelector:
        matchLabels:
          dev.okteto.com: "true"
    replicaCount: 2
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - preference:
              matchExpressions:
                - key: dev.okteto.com/overloaded
                  operator: DoesNotExist
            weight: 50
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/component
                    operator: In
                    values:
                      - controller
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                      - ingress-nginx
              topologyKey: kubernetes.io/hostname
    config:
      # The private endpoints requires "location" and "proxy_pass" in a server-snippet, so this parameter must have a value and not include neither "location" nor "proxy_pass". To use other options, they must be removed from list.
      annotation-value-word-blocklist: load_module,lua_package,_by_lua,root,serviceaccount
      log-format-escape-json: "true"
      log-format-upstream: '{"time": "$time_iso8601", "remote_addr": "$remote_addr", "x_forward_for": "$proxy_add_x_forwarded_for", "request_id": "$req_id", "remote_user": "$remote_user", "bytes_sent": $bytes_sent, "request_time": $request_time, "status": $status, "vhost": "$host", "request_proto": "$server_protocol", "path": "$uri", "request_query": "$args", "request_length": $request_length, "duration": $request_time,"method": "$request_method", "http_referrer": "$http_referer", "http_user_agent": "$http_user_agent" }'
      ignore-invalid-headers: "false"
      enable-underscores-in-headers: "true"
      proxy-buffer-size: 64K
      # TODO @jpf-okteto: allow-cross-namespace-resources
      # https://github.com/kubernetes/ingress-nginx/blob/controller-v1.11.2/internal/ingress/controller/config/config.go#L784
      # This property was `true` in v1.11.2 (4.11.2)
      # https://github.com/kubernetes/ingress-nginx/blob/controller-v1.12.0/internal/ingress/controller/config/config.go#L754
      # It switched to `false` in v1.12.0 (4.12.0)
      allow-cross-namespace-resources: "true"
      # TODO @jpf-okteto: strict-validate-path-type
      # https://github.com/kubernetes/ingress-nginx/blob/controller-v1.11.2/internal/ingress/controller/config/config.go#L932
      # This property was `false` in v1.11.2 (4.11.2)
      # https://github.com/kubernetes/ingress-nginx/blob/controller-v1.12.0/internal/ingress/controller/config/config.go#L897
      # It switched to `true` in v1.12.0 (4.12.0)
      strict-validate-path-type: "false"
      annotations-risk-level: Critical
      ssl-ciphers: "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:AES128-GCM-SHA256:AES128-GCM-SHA384"
    extraArgs:
      default-ssl-certificate: $(POD_NAMESPACE)/default-ssl-certificate-selfsigned
      default-backend-service: $(POD_NAMESPACE)/$(OKTETO_INGRESS_NGINX_DEFAULT_BACKEND)
    service:
      externalTrafficPolicy: Local
      type: LoadBalancer
    ingressClass: okteto-controlplane-nginx
    ingressClassResource:
      name: okteto-controlplane-nginx
      enabled: true
      default: false
      controllerValue: "k8s.io/okteto-controlplane-nginx"
    extraEnvs:
      - name: OKTETO_INGRESS_NGINX_DEFAULT_BACKEND
        valueFrom:
          configMapKeyRef:
            key: defaultbackendservice
            name: okteto-ingress-config
    priorityClassName:
  defaultBackend:
    enabled: false
okteto-nginx:
  enabled: true
  controller:
    # TODO @jpf-okteto: enableAnnotationValidations
    # https://github.com/kubernetes/ingress-nginx/blob/controller-v1.11.2/pkg/flags/flags.go#L161
    # This property was `false` in v1.11.2 (4.11.2)
    # https://github.com/kubernetes/ingress-nginx/blob/controller-v1.12.0/pkg/flags/flags.go#L162
    # It switched to `true` in v1.12.0 (4.12.0)
    enableAnnotationValidations: false
    image:
      chroot: true
      registry: ghcr.io
      image: okteto/ingress-nginx
      tag: 1.48.0
      digestChroot: ""
    allowSnippetAnnotations: true
    enableHttp: false
    admissionWebhooks:
      enabled: false
      namespaceSelector:
        matchLabels:
          dev.okteto.com: "true"
    replicaCount: 2
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - preference:
              matchExpressions:
                - key: dev.okteto.com/overloaded
                  operator: DoesNotExist
            weight: 50
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/component
                    operator: In
                    values:
                      - controller
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                      - okteto-nginx
              topologyKey: kubernetes.io/hostname
    config:
      # The private endpoints requires "location" and "proxy_pass" in a server-snippet, so this parameter must have a value and not include neither "location" nor "proxy_pass". To use other options, they must be removed from list.
      annotation-value-word-blocklist: load_module,lua_package,_by_lua,root,serviceaccount
      log-format-escape-json: "true"
      log-format-upstream: '{"time": "$time_iso8601", "remote_addr": "$remote_addr", "x_forward_for": "$proxy_add_x_forwarded_for", "request_id": "$req_id", "remote_user": "$remote_user", "bytes_sent": $bytes_sent, "request_time": $request_time, "status": $status, "vhost": "$host", "request_proto": "$server_protocol", "path": "$uri", "request_query": "$args", "request_length": $request_length, "duration": $request_time,"method": "$request_method", "http_referrer": "$http_referer", "http_user_agent": "$http_user_agent" }'
      ignore-invalid-headers: "false"
      enable-underscores-in-headers: "true"
      proxy-buffer-size: 64K
      annotations-risk-level: Critical
      # TODO @jpf-okteto: allow-cross-namespace-resources
      # https://github.com/kubernetes/ingress-nginx/blob/controller-v1.11.2/internal/ingress/controller/config/config.go#L784
      # This property was `true` in v1.11.2 (4.11.2)
      # https://github.com/kubernetes/ingress-nginx/blob/controller-v1.12.0/internal/ingress/controller/config/config.go#L754
      # It switched to `false` in v1.12.0 (4.12.0)
      allow-cross-namespace-resources: "true"
      # TODO @jpf-okteto: strict-validate-path-type
      # https://github.com/kubernetes/ingress-nginx/blob/controller-v1.11.2/internal/ingress/controller/config/config.go#L932
      # This property was `false` in v1.11.2 (4.11.2)
      # https://github.com/kubernetes/ingress-nginx/blob/controller-v1.12.0/internal/ingress/controller/config/config.go#L897
      # It switched to `true` in v1.12.0 (4.12.0)
      strict-validate-path-type: "false"
    service:
      type: ClusterIP
    ingressClass: okteto-nginx
    ingressClassResource:
      name: okteto-nginx
      enabled: true
      default: false
      controllerValue: "k8s.io/okteto-ingress-nginx"
    extraArgs:
      default-backend-service: $(POD_NAMESPACE)/$(OKTETO_INGRESS_NGINX_DEFAULT_BACKEND)
    extraEnvs:
      - name: OKTETO_INGRESS_NGINX_DEFAULT_BACKEND
        valueFrom:
          configMapKeyRef:
            key: defaultbackendservice
            name: okteto-ingress-config
    priorityClassName:
  defaultBackend:
    enabled: false

kubeAPIServerProxy:
  # tls.enabled controls whether Envoy terminates TLS on port 8443.
  # When true, Envoy listens on 8443 using tls.secretName. The HTTPRoute
  # targets port 8443 and the Gateway must talk TLS to Envoy (provisioned by
  # backendTLSPolicy below, by a service mesh, or by a user-supplied policy).
  # When false, Envoy serves plain HTTP only on port 8080 and the HTTPRoute
  # targets 8080. backendTLSPolicy.enabled must also be false in that case.
  tls:
    enabled: true
    secretName: ""
  backendTLSPolicy:
    # When true, the chart creates a Gateway API BackendTLSPolicy directing the
    # Gateway to verify TLS to Envoy. Requires tls.enabled=true. Set to false
    # if backend TLS is managed externally (service mesh, user-supplied
    # BackendTLSPolicy, etc.) or if tls.enabled=false.
    enabled: true
    wellKnownCACertificates: System
    caCertificateRefs: []
  backendTrafficPolicy:
    enabled: true
  image:
    repository: okteto/envoy
    tag: "1.48.0"
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 256Mi
  replicaCount: 2
  priorityClassName:
  # admin exposes Envoy's admin/metrics interface on 127.0.0.1 inside the pod.
  # Reachable via `kubectl port-forward` only — never published in the Service
  # or HTTPRoute. Endpoints: /stats/prometheus, /clusters, /config_dump, /ready.
  admin:
    enabled: true
    port: 9901
  # concurrency sets Envoy's --concurrency worker thread count. Leave empty
  # to let Envoy auto-detect from cgroup CPU quota (recommended).
  concurrency: ""
  # drainTimeSeconds bounds how long Envoy drains in-flight connections
  # after SIGTERM (via --drain-time-s). Must fit inside the pod's
  # terminationGracePeriodSeconds (32s) along with the preStop sleep.
  drainTimeSeconds: 25
  # preStopSleepSeconds delays SIGTERM (via lifecycle.preStop.sleep) so kube-proxy
  # / endpoints have time to converge before Envoy starts draining. Requires
  # Kubernetes 1.32+ for the sleep action.
  preStopSleepSeconds: 5
  # Custom labels/annotations added to the kube-apiserver-proxy Deployment metadata.
  labels: {}
  annotations: {}
  # Custom labels/annotations added to the kube-apiserver-proxy pod template.
  podLabels: {}
  podAnnotations: {}

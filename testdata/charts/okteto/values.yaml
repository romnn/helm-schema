buildkit:
  enabled: true
  annotations: {}
  tolerations: []
  nodeSelectors: {}
  labels: {}
  extraEnv: []
  image:
    repository: okteto/buildkit
    tag: 1.48.0
  rootless:
    enabled: false
    image:
      repository: okteto/buildkit
      tag: 1.48.0-rootless
  replicaCount: 1
  terminationGracePeriodSeconds: 600 # 10 minutes for graceful shutdown
  # runs `buildctl debug workers` over buildkitd's local unix socket. There is no startupProbe
  # on purpose, so a slow cache load leaves the pod NotReady instead of restarting it.
  # buildctl blocks until the daemon serves, giving up after its own 5s timeout, and the kubelet
  # starts a probe every periodSeconds regardless of how long the previous one took. So a probe is
  # in flight 5s out of every 15s and the worst case for noticing a ready daemon is 10s.
  # timeoutSeconds must stay above buildctl's 5s so buildctl times out first and exits non-zero.
  readinessProbe:
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 3
    # a single successful check is enough to mark the pod Ready
    successThreshold: 1
  hpa:
    # Ref: https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/
    enabled: false
    min: 1
    max: 5
    # Metrics adapter that exposes buildkit metrics via Kubernetes custom metrics API
    adapter:
      # Controls the creation of adapter deployment, service, and APIService
      enabled: true
      priorityClassName:
      extraEnv: []
      replicaCount: 2
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
      # APIService registration for custom metrics API
      apiService:
        name: v1beta2.custom.metrics.k8s.io
        group: custom.metrics.k8s.io
        version: v1beta2
        groupPriorityMinimum: 100
        versionPriority: 100
    # Custom metrics for autoscaling based on buildkit pressure indicators
    metrics:
      - type: Pods
        pods:
          metric:
            name: okteto_build_active_builds
          target:
            type: AverageValue
            averageValue: "0.99"
    # Scaling behavior configuration
    behavior:
      scaleUp:
        policies:
          - type: Pods
            value: 1
            periodSeconds: 30
      scaleDown:
        stabilizationWindowSeconds: 600 # Wait 10 minutes before scaling down
        policies:
          - type: Pods
            value: 1
            periodSeconds: 150
  podManagementPolicy: OrderedReady
  ingress:
    enabled: true
    annotations:
      nginx.ingress.kubernetes.io/service-upstream: "true"
      nginx.ingress.kubernetes.io/proxy-body-size: "0"
      nginx.ingress.kubernetes.io/backend-protocol: "GRPCS"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "1800"
      nginx.ingress.kubernetes.io/configuration-snippet: |
        grpc_intercept_errors off;
        grpc_buffer_size 64k;
      # If empty, okteto will default to the wildcard certificate
  service:
    type: ClusterIP
    sessionAffinity:
    loadBalancerIP:
    labels: {}
    annotations: {}
    port: 443
    # List of CIDRs allowed to access the LoadBalancer service
    loadBalancerSourceRanges: []
  network:
    mode: auto
  resources:
    requests:
      cpu: 1
      memory: 4Gi
  persistence:
    enabled: true
    class:
    size: 100Gi
    cacheRatio: 0.5
    accessModes: ["ReadWriteOnce"]
  serviceAccount:
    create: true
    name: okteto-buildkit
    annotations: {}
    labels: {}
  priorityClassName:

{{- if .Values.crds.install }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    {{- with .Values.crds.annotations }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
  labels:
    app.kubernetes.io/part-of: "okteto"
    app.kubernetes.io/name: agents.okteto.com
  name: agents.okteto.com
spec:
  group: okteto.com
  names:
    kind: Agent
    listKind: AgentList
    plural: agents
    singular: agent
  scope: Namespaced
  versions:
  - name: v1
    schema:
      openAPIV3Schema:
        description: Agent represents an agent executing a task
        type: object
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            required:
              - title
              - status
              - prompt
            properties:
              title:
                type: string
              status:
                type: string
              error_reason:
                type: string
              chat_status:
                type: string
              prompt:
                type: string
              repository:
                type: string
              branch:
                type: string
              vscode_url:
                type: string
              chat_url:
                type: string
    served: true
    storage: true
{{- end }}
{{- if and .Values.crds.install .Values.unsupported.linkerdDivert.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    {{- with .Values.crds.annotations }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
  labels:
    app.kubernetes.io/part-of: "okteto"
    app.kubernetes.io/name: diverts.okteto.com
  name: diverts.okteto.com
spec:
  group: okteto.com
  names:
    kind: Divert
    listKind: DivertList
    plural: diverts
    singular: divert
  scope: Namespaced
  versions:
  - name: v1
    schema:
      openAPIV3Schema:
        description: Divert represents a configuration to route traffic from a service in the shared namespace to a service with the same name in the namespace where this resource is created, based on the Okteto divert HTTP header value defined in this resource
        type: object
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            required:
              - sharedNamespace
              - service
              - divertKey
            properties:
              sharedNamespace:
                type: string
                description: Namespace where the original service is deployed, from which traffic will be routed to the diverted namespace based on the divert key
              service:
                type: string
                description: Service whose traffic will be routed from the shared namespace to the diverted one based on the divert key
              divertKey:
                type: string
                description: Value to be set in the Okteto divert HTTP header when traffic to the target service should be routed from the shared namespace to the diverted one
    served: true
    storage: true
{{- end }}
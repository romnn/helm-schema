{{- if eq "true" (include "okteto.kubeAPIServerProxy.enabled" .) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: "{{ include "okteto.fullname" . }}-kube-apiserver-proxy"
  labels:
    app.kubernetes.io/component: "kube-apiserver-proxy"
    app.kubernetes.io/part-of: "okteto"
    app.kubernetes.io/name: "{{ include "okteto.fullname" . }}-kube-apiserver-proxy"
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    helm.sh/chart: {{ include "okteto.chart" . }}
    app.kubernetes.io/instance: "{{ .Release.Name }}"
    app.kubernetes.io/managed-by: {{ .Release.Service }}
automountServiceAccountToken: false
{{- if .Values.imagePullSecrets }}
imagePullSecrets:
{{- range .Values.imagePullSecrets }}
- name: {{ . }}
{{- end }}
{{- end }}
{{- end }}

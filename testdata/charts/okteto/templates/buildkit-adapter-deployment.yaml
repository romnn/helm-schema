{{- if and .Values.buildkit.enabled .Values.buildkit.hpa.enabled .Values.buildkit.hpa.adapter.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ include "okteto.fullname" . }}-buildkit-adapter"
  labels:
    app.kubernetes.io/component: "buildkit-adapter"
    app.kubernetes.io/part-of: "okteto"
    app.kubernetes.io/name: "{{ include "okteto.fullname" . }}-buildkit-adapter"
    helm.sh/chart: {{ include "okteto.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    secret.reloader.stakater.com/reload: "{{ include "okteto.tlsSecretsToReload" . }}"
spec:
  replicas: {{ .Values.buildkit.hpa.adapter.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: "{{ include "okteto.fullname" . }}-buildkit-adapter"
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "{{ include "okteto.fullname" . }}-buildkit-adapter"
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: "buildkit-adapter"
        app.kubernetes.io/part-of: "okteto"
{{- if .Values.podLabels }}
{{ toYaml .Values.podLabels | indent 8 }}
{{- end }}
      annotations:
        checksum/configmap: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
{{- if .Values.podAnnotations }}
{{ toYaml .Values.podAnnotations | indent 8 }}
{{- end }}
    spec:
      affinity:
        nodeAffinity:
{{ include "okteto.oktetoAffinity" . | indent 10 }}
        podAntiAffinity:
          {{- if .Values.affinity.required }}
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                    - "{{ include "okteto.fullname" . }}-buildkit-adapter"
              topologyKey: kubernetes.io/hostname
          {{- else }}
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                      - "{{ include "okteto.fullname" . }}-buildkit-adapter"
                topologyKey: kubernetes.io/hostname
          {{- end }}
      serviceAccountName: {{ include "okteto.fullname" . }}
      {{- include "okteto.tolerations" (dict "globalsTolerations" .Values.globals.tolerations.okteto "poolTolerations" .Values.tolerations.oktetoPool ) | nindent 6 }}
      {{- include "okteto.nodeSelectors" (dict "poolTolerations" .Values.tolerations.oktetoPool "nodeSelectors" .Values.globals.nodeSelectors.okteto ) | nindent 6 }}
      priorityClassName: {{ .Values.buildkit.hpa.adapter.priorityClassName | default .Values.globals.priorityClassName }}
      volumes:
        - name: metrics-adapter-tls-certs
          secret:
            defaultMode: 420
            secretName: {{ include "okteto.internalCertificate" . }}
      securityContext:
        runAsNonRoot: true
      containers:
        - name: buildkit-adapter
          image: {{ include "okteto.image.backend" . }}
          imagePullPolicy: {{ .Values.pullPolicy }}
          args: [ "buildkit-adapter" ]
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
          env:
            - name: OKTETO_NAMESPACE
              value: {{ .Release.Namespace }}
{{- if .Values.buildkit.hpa.adapter.extraEnv }}
{{ toYaml .Values.buildkit.hpa.adapter.extraEnv | indent 12 }}
{{- end }}
          envFrom:
            - configMapRef:
                name: "{{ include "okteto.fullname" . }}"
          volumeMounts:
            - mountPath: /certs
              name: metrics-adapter-tls-certs
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 3
            periodSeconds: 3
            failureThreshold: 3
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 3
            periodSeconds: 3
            failureThreshold: 3
            timeoutSeconds: 10
          resources:
            {{ toYaml .Values.buildkit.hpa.adapter.resources | nindent 12 }}
{{- end }}

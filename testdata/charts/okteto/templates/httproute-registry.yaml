{{- if .Values.registry.enabled }}
{{- if .Values.registry.ingress.enabled }}
{{- if eq "true" (include "okteto.controlplane.gateway.enabled" .) }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "okteto.fullname" . }}-registry
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "okteto.fullname" . }}-registry
    helm.sh/chart: {{ include "okteto.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: "okteto"
    app.kubernetes.io/component: "registry"
    {{- with .Values.endpoints.okteto.gatewayAPI.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations: {{ merge .Values.registry.ingress.annotations .Values.endpoints.okteto.gatewayAPI.annotations | toJson }}
spec:
  parentRefs: {{ include "okteto.controlplane.gateway.parentRefs" . }}
  hostnames:
    - {{ (include "okteto.registry" .) | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "okteto.fullname" . }}-registry
          port: {{ .Values.registry.port }}
{{- end }}
{{- end }}
{{- end }}

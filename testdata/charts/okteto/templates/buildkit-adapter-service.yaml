{{- if and .Values.buildkit.enabled .Values.buildkit.hpa.enabled .Values.buildkit.hpa.adapter.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: "{{ include "okteto.fullname" . }}-buildkit-adapter"
  labels:
    app.kubernetes.io/component: "buildkit-adapter"
    app.kubernetes.io/part-of: "okteto"
    app.kubernetes.io/name: "{{ include "okteto.fullname" . }}-buildkit-adapter"
    helm.sh/chart: {{ include "okteto.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  type: ClusterIP
  ports:
    - port: 443
      targetPort: 8443
      name: https
  selector:
    app.kubernetes.io/name: "{{ include "okteto.fullname" . }}-buildkit-adapter"
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}

{{- if .Values.buildkit.enabled }}
{{- if eq (include "okteto.buildkit.ingress.enabled" . ) "true" }}
{{- if eq (include "okteto.controlplane.ingress.enabled" .) "true" }}
{{- if not .Values.openshift.enabled }}
{{- $buildkitURL := include "okteto.buildkit" . -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "okteto.fullname" . }}-buildkit
  labels:
    app.kubernetes.io/name: {{ include "okteto.fullname" . }}-buildkit
    helm.sh/chart: {{ include "okteto.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: "okteto"
    app.kubernetes.io/component: "buildkit"
    {{- with (include "okteto.controlplane.ingress.labels" . | fromJson) }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations: {{ merge .Values.buildkit.ingress.annotations (include "okteto.controlplane.ingress.annotations" . | fromJson) | toJson }}
spec:
  ingressClassName: {{ include "okteto.controlplane.ingressClass" . }}
  tls:
  - hosts:
    - {{ $buildkitURL }}
    secretName: {{ include "okteto.buildkit.tlsSecret" . }}
  rules:
    - host: {{ $buildkitURL }}
      http:
        paths:
          - path: "/"
            pathType: Prefix
            backend:
              service:
                name: {{ include "okteto.fullname" . }}-buildkit
                port:
                  number: {{ .Values.buildkit.service.port }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}

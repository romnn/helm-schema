{{- if .Values.prepullImages.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: "{{ include "okteto.fullname" . }}-prepullimages"
  labels:
    app.kubernetes.io/name: "{{ include "okteto.fullname" . }}-prepullimages"
    helm.sh/chart: {{ include "okteto.chart" . }}
    app.kubernetes.io/component: "prepullimages"
    app.kubernetes.io/part-of: "okteto"
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: "{{ include "okteto.fullname" . }}-prepullimages"
      app.kubernetes.io/instance: {{ .Release.Name }}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 100%
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "{{ include "okteto.fullname" . }}-prepullimages"
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: "prepullimages"
        app.kubernetes.io/part-of: "okteto"
{{- if .Values.podLabels }}
{{ toYaml .Values.podLabels | indent 8 }}
{{- end }}
      annotations:
        app.kubernetes.io/version: "{{ .Release.Name }}-{{ .Chart.Name }}-{{ include "okteto.version" . }}"
{{- if .Values.podAnnotations }}
{{ toYaml .Values.podAnnotations | indent 8 }}
{{- end }}
    spec:
      terminationGracePeriodSeconds: 0
      priorityClassName: {{ .Values.prepullImages.priorityClassName | default .Values.globals.priorityClassName }}
      {{- include "okteto.tolerations" (dict "globalsTolerations" .Values.globals.tolerations.dev "poolTolerations" .Values.tolerations.devPool ) | nindent 6 }}
      {{- include "okteto.nodeSelectors" (dict "poolTolerations" .Values.tolerations.devPool "nodeSelectors" .Values.globals.nodeSelectors.dev ) | nindent 6 }}
      containers:
      - name: backend
        image: {{ include "okteto.image.backend" . }}
        command: ["tail", "-f", "/dev/null"]
      - name: cli
        image: "{{ include "okteto.formatRegistryAndRepo" .Values.cli.image }}:{{ include "okteto.cliVersion" . }}"
        command: ["tail", "-f", "/dev/null"]
      - name: installer
        image: {{ include "okteto.image.installerrunner" . }}
        command: ["tail", "-f", "/dev/null"]
{{- end}}

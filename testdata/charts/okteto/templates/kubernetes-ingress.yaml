{{- if and (not .Values.cluster.endpoint) (eq "true" (include "okteto.controlplane.ingress.enabled" .)) }}
{{- $url := urlParse (include "okteto.clusterEndpoint" .) -}}
{{- $hostParts := mustRegexSplit ":" (get $url "host" ) -1 -}}
{{- $host := first $hostParts -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "okteto.fullname" . }}-cluster-endpoint
  labels:
    app.kubernetes.io/name: {{ include "okteto.fullname" . }}-cluster-endpoint
    helm.sh/chart: {{ include "okteto.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: "okteto"
    app.kubernetes.io/component: "cluster-endpoint"
    {{- with (include "okteto.controlplane.ingress.labels" . | fromJson) }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-ssl-server-name: "on"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    {{- with (include "okteto.controlplane.ingress.annotations" . | fromJson) }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ include "okteto.controlplane.ingressClass" . }}
  tls:
  - hosts:
    - "{{ $host }}"
    secretName: {{ include "okteto.ingress.tlsSecret" . }}
  rules:
    - host: "{{ $host }}"
      http:
        paths:
          - path: "/"
            pathType: Prefix
            backend:
              service:
                name: {{ include "okteto.fullname" . }}-cluster-endpoint
                port:
                  number: 443
{{- end }}

{{- if and .Values.kubeAPIServerProxy.backendTLSPolicy.enabled (eq "true" (include "okteto.kubeAPIServerProxy.enabled" .)) }}
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: {{ include "okteto.fullname" . }}-kubernetes
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: "kube-apiserver-proxy"
    app.kubernetes.io/part-of: "okteto"
    app.kubernetes.io/name: "{{ include "okteto.fullname" . }}-kube-apiserver-proxy"
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    helm.sh/chart: {{ include "okteto.chart" . }}
    app.kubernetes.io/instance: "{{ .Release.Name }}"
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: {{ include "okteto.fullname" . }}-kube-apiserver-proxy
      sectionName: https
  validation:
    hostname: {{ include "okteto.kubeAPIServerProxy.hostname" . | quote }}
    {{- if .Values.kubeAPIServerProxy.backendTLSPolicy.caCertificateRefs }}
    caCertificateRefs:
{{ toYaml .Values.kubeAPIServerProxy.backendTLSPolicy.caCertificateRefs | indent 6 }}
    {{- else }}
    wellKnownCACertificates: {{ .Values.kubeAPIServerProxy.backendTLSPolicy.wellKnownCACertificates | default "System" | quote }}
    {{- end }}
{{- end }}

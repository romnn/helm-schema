{{- define "unrelated-writer" -}}{{- $_ := set (dict) "marker" true -}}{{- end -}}
{{- define "decoder" -}}
{{- $x := fromJson "[]" -}}
{{- if not $x -}}
{{- trunc (int64 1) "ok" -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: decoder
data:
  value: {{ include "decoder" . | quote }}

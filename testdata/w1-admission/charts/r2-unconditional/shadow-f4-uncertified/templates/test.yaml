{{- define "unrelated-writer" -}}{{- $_ := set (dict) "marker" true -}}{{- end -}}
{{- define "shadow" -}}
{{- $x := dict "a" 1 -}}
{{- if true -}}
{{- $x := 0.0 -}}
{{- end -}}
{{- if not $x -}}
